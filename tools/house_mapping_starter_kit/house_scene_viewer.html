<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parametric House Scene Viewer - Three.js r184</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #202020;
    }

    canvas { display: block; }

    #toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      font-size: 13px;
      user-select: none;
    }

    #toolbar input[type="range"] { width: 120px; }
    #toolbar input[type="number"] { width: 82px; }
    #toolbar select, #toolbar input[type="number"], #toolbar input[type="text"] {
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 4px;
      padding: 4px;
      background: #1f1f1f;
      color: #fff;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      background: #ff9940;
      color: #fff;
    }

    button:hover { opacity: 0.85; }
    button.secondary { background: #4d7cff; }
    button.neutral { background: #666; }
    button.active { background: #18a558; }

    label {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .lblbox {
      border: 1px solid white;
      padding: 5px;
      border-radius: 5px;
    }

    #status {
      opacity: 0.9;
      white-space: nowrap;
    }

    #output {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      box-sizing: border-box;
      max-width: min(860px, calc(100vw - 24px));
      max-height: 42vh;
      margin: 0;
      padding: 10px;
      overflow: auto;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #d7ffd7;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <label class="lblbox" title="Generated scene and JSON export.">
      scene
      <button id="frameButton" class="secondary" type="button">FRAME OBJECT</button>
      <button id="exportButton" type="button">EXPORT SCENE JSON</button>
      <button id="jsonCameraButton" class="neutral" type="button">JSON CAMERA</button>
    </label>

    <label class="lblbox" title="Camera perspective and helper overlays.">
      <input type="checkbox" id="helpersToggle" checked /> 3D grid
      perspective
      <input id="fovSlider" type="range" min="5" max="90" step="1" value="50" />
      <span id="fovValue">50°</span>
    </label>

    <label class="lblbox" title="Choose an object, one light, or the full light rig; enable transform to move it with the mouse.">
      control
      <select id="controlTargetSelect"></select>
      <button id="moveLightButton" class="neutral" type="button" aria-pressed="false">MOVE SELECTED: OFF</button>
      <select id="transformModeSelect" title="Transform mode">
        <option value="translate">translate</option>
        <option value="rotate">rotate</option>
        <option value="scale">scale</option>
      </select>
    </label>

    <label class="lblbox" title="Cartesian position of the selected controllable object.">
      pos
      x <input id="posX" type="number" step="0.01" />
      y <input id="posY" type="number" step="0.01" />
      z <input id="posZ" type="number" step="0.01" />
      <button id="applyPosButton" class="secondary" type="button">APPLY</button>
    </label>

    <span id="coords" title="Selected object's position">selected: —</span>
    <span id="status">Waiting for Three.js and THREEJS_scene.js…</span>
  </div>

  <pre id="output"></pre>

  <!--
    Three.js r184 dependency bridge, without import maps.
    This keeps the viewer as a normal stand-alone HTML file while exposing
    window.THREE, window.OrbitControls and window.TransformControls.
  -->
  <script type="module">
    import * as THREE from "https://esm.sh/three@0.184.0";
    import { OrbitControls } from "https://esm.sh/three@0.184.0/addons/controls/OrbitControls.js";
    import { TransformControls } from "https://esm.sh/three@0.184.0/addons/controls/TransformControls.js";

    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
    window.TransformControls = TransformControls;
    window.dispatchEvent(new Event("THREEJS_R184_READY"));
  </script>

  <!-- This script must define window.buildThreeJSScene(ctx). -->
  <script type="text/javascript" src="THREEJS_scene.js"></script>

  <script type="text/javascript">
  (function bootWhenThreeJSR184IsReady() {
    let booted = false;

    function bootViewer() {
      if (booted) return;
      booted = true;

      const THREE = window.THREE;
      const OrbitControls = window.OrbitControls;
      const TransformControls = window.TransformControls;

      const status = document.getElementById("status");
      if (!THREE || !OrbitControls || !TransformControls) {
        status.textContent = "Three.js r184 dependencies are not available.";
        return;
      }
      if (typeof window.buildThreeJSScene !== "function") {
        status.textContent = "THREEJS_scene.js did not expose window.buildThreeJSScene(ctx).";
        return;
      }

      const scene = new THREE.Scene();
      scene.name = "ParametricHouseScene";
      scene.background = new THREE.Color(0x202020);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
      camera.name = "ViewerCamera";
      camera.position.set(8, 5.5, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const orbit = new OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;
      orbit.dampingFactor = 0.08;
      orbit.target.set(2.5, 1.5, 2.2);

      const generatedRoot = new THREE.Group();
      generatedRoot.name = "GeneratedHouseRoot";
      scene.add(generatedRoot);

      const grid = new THREE.GridHelper(20, 20, 0x777777, 0x404040);
      grid.name = "GridHelper";
      scene.add(grid);

      const axes = new THREE.AxesHelper(2.0);
      axes.name = "AxesHelper_X_East_Y_Up_Z_South";
      scene.add(axes);

      const lightRig = new THREE.Group();
      lightRig.name = "LightRig_AllLights";
      scene.add(lightRig);

      const ambient = new THREE.AmbientLight(0xffffff, 0.62);
      ambient.name = "AmbientLight";
      scene.add(ambient);

      const pointNorth = new THREE.PointLight(0xffffff, 1.1, 70);
      pointNorth.name = "PointLight_NorthWest";
      pointNorth.position.set(-4, 6, -4);
      pointNorth.castShadow = true;
      lightRig.add(pointNorth);

      const pointSouth = new THREE.PointLight(0xffffff, 0.75, 70);
      pointSouth.name = "PointLight_SouthEast";
      pointSouth.position.set(7, 5, 7);
      lightRig.add(pointSouth);

      const directional = new THREE.DirectionalLight(0xffffff, 0.85);
      directional.name = "DirectionalLight_Day";
      directional.position.set(4, 8, -2);
      lightRig.add(directional);

      const buildResult = window.buildThreeJSScene({ THREE, scene, root: generatedRoot, units: "m" }) || {};
      if (buildResult.cameraTarget) orbit.target.copy(buildResult.cameraTarget);

      const transform = new TransformControls(camera, renderer.domElement);
      const transformHelper = typeof transform.getHelper === "function" ? transform.getHelper() : transform;
      transformHelper.name = "TransformControlsHelper";
      scene.add(transformHelper);
      transform.setMode("translate");
      transform.addEventListener("dragging-changed", (event) => {
        orbit.enabled = !event.value;
      });
      transform.addEventListener("objectChange", updateSelectedPositionUI);

      const controlTargetSelect = document.getElementById("controlTargetSelect");
      const moveLightButton = document.getElementById("moveLightButton");
      const transformModeSelect = document.getElementById("transformModeSelect");
      const coords = document.getElementById("coords");
      const posX = document.getElementById("posX");
      const posY = document.getElementById("posY");
      const posZ = document.getElementById("posZ");

      const controllables = new Map();
      controllables.set("camera", camera);
      controllables.set("lightRig", lightRig);
      controllables.set("pointNorth", pointNorth);
      controllables.set("pointSouth", pointSouth);
      controllables.set("directional", directional);
      addMeshControllables(generatedRoot, controllables);
      refreshControlTargetSelect(controllables);

      let transformEnabled = false;

      function addMeshControllables(root, map) {
        root.traverse((obj) => {
          if (obj === root) return;
          if (obj.isMesh || obj.isGroup) {
            const key = obj.uuid;
            map.set(key, obj);
          }
        });
      }

      function refreshControlTargetSelect(map) {
        controlTargetSelect.innerHTML = "";
        for (const [key, obj] of map.entries()) {
          const option = document.createElement("option");
          option.value = key;
          option.textContent = obj.name || obj.type || key;
          controlTargetSelect.appendChild(option);
        }
        controlTargetSelect.value = "lightRig";
        updateSelectedPositionUI();
      }

      function getSelectedObject() {
        return controllables.get(controlTargetSelect.value) || lightRig;
      }

      function setTransformAttachment() {
        const obj = getSelectedObject();
        if (transformEnabled && obj !== camera) {
          transform.attach(obj);
        } else {
          transform.detach();
        }
        updateSelectedPositionUI();
      }

      function updateSelectedPositionUI() {
        const obj = getSelectedObject();
        const p = obj.position;
        posX.value = p.x.toFixed(3);
        posY.value = p.y.toFixed(3);
        posZ.value = p.z.toFixed(3);
        coords.textContent = `${obj.name || obj.type}: x=${p.x.toFixed(3)}, y=${p.y.toFixed(3)}, z=${p.z.toFixed(3)}`;
      }

      moveLightButton.addEventListener("click", () => {
        transformEnabled = !transformEnabled;
        moveLightButton.setAttribute("aria-pressed", transformEnabled ? "true" : "false");
        moveLightButton.textContent = transformEnabled ? "MOVE SELECTED: ON" : "MOVE SELECTED: OFF";
        moveLightButton.classList.toggle("active", transformEnabled);
        moveLightButton.classList.toggle("neutral", !transformEnabled);
        setTransformAttachment();
      });

      controlTargetSelect.addEventListener("change", setTransformAttachment);
      transformModeSelect.addEventListener("change", () => transform.setMode(transformModeSelect.value));

      document.getElementById("applyPosButton").addEventListener("click", () => {
        const obj = getSelectedObject();
        obj.position.set(parseFloat(posX.value) || 0, parseFloat(posY.value) || 0, parseFloat(posZ.value) || 0);
        updateSelectedPositionUI();
      });

      document.getElementById("helpersToggle").addEventListener("change", (event) => {
        grid.visible = event.target.checked;
        axes.visible = event.target.checked;
      });

      const fovSlider = document.getElementById("fovSlider");
      const fovValue = document.getElementById("fovValue");
      fovSlider.addEventListener("input", () => {
        camera.fov = Number(fovSlider.value);
        camera.updateProjectionMatrix();
        fovValue.textContent = `${camera.fov}°`;
      });

      document.getElementById("frameButton").addEventListener("click", () => frameObject(getSelectedObject() === camera ? generatedRoot : getSelectedObject()));
      document.getElementById("jsonCameraButton").addEventListener("click", () => showOutput(JSON.stringify(camera.toJSON(), null, 2)));
      document.getElementById("exportButton").addEventListener("click", () => {
        const json = scene.toJSON();
        json.metadata = json.metadata || {};
        json.metadata.generator = "house_scene_viewer.html + THREEJS_scene.js";
        json.userData = json.userData || {};
        json.userData.coordinateSystem = {
          x: "east-west, positive east",
          y: "down-up, positive up",
          z: "north-south, positive south because the back of the house faces south"
        };
        downloadJSON(json, "threejs_house_scene_export.json");
        showOutput(JSON.stringify({ exported: "threejs_house_scene_export.json", objects: scene.children.length }, null, 2));
      });

      function frameObject(object) {
        const box = new THREE.Box3().setFromObject(object);
        if (!Number.isFinite(box.min.x) || box.isEmpty()) return;
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z, 1);
        const fov = camera.fov * Math.PI / 180;
        let distance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 1.8;
        const direction = new THREE.Vector3(1, 0.75, 1).normalize();
        camera.position.copy(center).add(direction.multiplyScalar(distance));
        orbit.target.copy(center);
        camera.near = Math.max(0.01, distance / 1000);
        camera.far = Math.max(1000, distance * 100);
        camera.updateProjectionMatrix();
        orbit.update();
      }

      function showOutput(text) {
        const output = document.getElementById("output");
        output.style.display = "block";
        output.textContent = text;
      }

      function downloadJSON(data, filename) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
      }

      frameObject(generatedRoot);
      status.textContent = "Scene generated from THREEJS_scene.js. Orbit with mouse; enable MOVE SELECTED to transform lights or meshes.";
      animate();
    }

    if (window.THREE && window.OrbitControls && window.TransformControls) {
      bootViewer();
    } else {
      window.addEventListener("THREEJS_R184_READY", bootViewer, { once: true });
    }
  })();
  </script>
</body>
</html>
